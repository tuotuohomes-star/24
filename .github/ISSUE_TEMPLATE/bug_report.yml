name: Bug 报告
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实价格、客户资料、账号、密码或其他敏感数据。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 请说明发生了什么，以及你原本期望看到什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请按顺序列出操作步骤。示例数据必须是虚构或脱敏数据。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 使用环境
      description: 例如 macOS 15 + Chrome 版本号，或 Windows 11 + Edge 版本号。
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: 文件规模
      description: 可填写大致行数和文件大小，不要上传真实文件。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认没有在此 Issue 中提供真实业务数据、密码或密钥。
          required: true
